<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareShell — Nurse Console</title>
  <style>
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #262c35;
      --text: #e6e9ee; --muted: #8b95a3;
      --ok: #3fa66a; --warn: #d98324; --alert: #d2413a; --review: #4a7fd0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    header {
      padding: 18px 24px; border-bottom: 1px solid var(--line);
      display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    }
    h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
    .status { font-size: 13px; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: var(--muted); margin-right: 6px; vertical-align: middle; }
    .dot.live { background: var(--ok); }
    main { padding: 20px 24px; max-width: 1100px; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); font-weight: 600;
      padding: 8px 12px; border-bottom: 1px solid var(--line);
    }
    td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .code {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em; white-space: nowrap;
    }
    .MED_ON_TIME { background: rgba(63,166,106,.15); color: var(--ok); }
    .MED_OUT_OF_WINDOW, .MISSED_DOSE { background: rgba(217,131,36,.15); color: var(--warn); }
    .DOUBLE_DOSE_BLOCKED, .MAX_DAILY_DOSES_BLOCKED, .NIGHT_OUT_OF_BED {
      background: rgba(210,65,58,.15); color: var(--alert);
    }
    .NEEDS_HUMAN_REVIEW { background: rgba(74,127,208,.15); color: var(--review); }
    .empty { color: var(--muted); padding: 40px 12px; text-align: center; }
    tr.fresh { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: rgba(74,127,208,.14); } to { background: transparent; } }
  </style>
</head>
<body>
  <header>
    <h1>CareShell — Nurse Console</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
    <span class="status" id="count"></span>
  </header>
  <main>
    <table>
      <thead>
        <tr><th style="width:130px">Time</th><th style="width:200px">Event</th>
            <th style="width:120px">Medication</th><th>Detail</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="empty">Waiting for events…</td></tr>
      </tbody>
    </table>
  </main>

<script>
const rows = document.getElementById('rows');
const dot = document.getElementById('dot');
const conn = document.getElementById('conn');
const count = document.getElementById('count');
let total = 0;

const fmt = ts => {
  const d = new Date(ts);
  return isNaN(d) ? ts : d.toLocaleString([], {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });
};

function addRow(d, fresh) {
  if (rows.querySelector('.empty')) rows.innerHTML = '';
  const tr = document.createElement('tr');
  if (fresh) tr.className = 'fresh';
  const cell = (html, cls) => {
    const td = document.createElement('td');
    if (cls) td.className = cls;
    td.innerHTML = html;
    return td;
  };
  const esc = s => String(s ?? '').replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  tr.append(
    cell(esc(fmt(d.ts)), 'time'),
    cell(`<span class="code ${esc(d.code)}">${esc(d.code)}</span>`),
    cell(esc(d.med_id || '—'), 'time'),
    cell(esc(d.message))
  );
  rows.prepend(tr);
  total++;
  count.textContent = `${total} event${total === 1 ? '' : 's'}`;
}

fetch('/api/history?limit=100')
  .then(r => r.json())
  .then(data => data.decisions.slice().reverse().forEach(d => addRow(d, false)))
  .catch(() => {});

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/events`);
  ws.onopen = () => { dot.className = 'dot live'; conn.textContent = 'live'; };
  ws.onmessage = e => { try { addRow(JSON.parse(e.data), true); } catch (_) {} };
  ws.onclose = () => {
    dot.className = 'dot'; conn.textContent = 'reconnecting…';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
