# CareShell OpenShell policy preset — OPTIONAL, and not applied by default.
#
#   nemoclaw <sandbox> policy-add --from-file openshell/careshell-preset.yaml --yes
#
# Read this before assuming you need it.
#
# ## CareShell needs no policy delta on a stock NemoClaw sandbox
#
# Verified against nemoclaw v0.0.93 / openshell 0.0.85 by reading the live policy
# (`nemoclaw <sandbox> policy-get`) and the preset schema
# (~/.nemoclaw/source/schemas/policy-preset.schema.json):
#
#   * Filesystem — the baseline already grants read_write on /sandbox and /tmp.
#     CareShell lives at /sandbox/app, so nothing needs adding. Presets CANNOT declare
#     filesystem rules at all: the schema's only top-level keys are `preset` and
#     `network_policies`. There is no mounts/ingress section, and code gets into the
#     sandbox with `nemoclaw <sandbox> upload`, not a host bind mount.
#
#   * Inference — the baseline `local-inference` preset already routes
#     https://inference.local. Note https: plain http is refused by the egress proxy
#     with a 403.
#
#   * Nurse console — reaching :8000 from the host is a gRPC tunnel, not a policy rule:
#         openshell forward service --target-port 8000 --local 8000 <sandbox>
#
#   * Egress — denial is by OMISSION from the allowlist. There is no `egress: deny-all`
#     key. OpenShell enforces it with a userspace HTTP CONNECT proxy plus OPA, NOT a
#     kernel packet filter; the kernel-enforced parts are Landlock (filesystem) and
#     seccomp (syscalls). Adding endpoints here WIDENS egress — it never narrows it.
#
# ## When you would actually use this file
#
# Only to let the sandbox reach an additional host — say a facility EHR on the LAN that
# supplies the patient timeline. The example below is commented out because granting
# egress to a stock demo would weaken the air-gap claim the demo is built on.

preset:
  name: careshell
  description: "CareShell eldercare agent — optional additional egress"

network_policies:
  careshell:
    name: careshell
    # No endpoints: this preset grants nothing. It exists as a schema-valid starting
    # point. Uncomment and edit to allow a specific host, then re-apply.
    endpoints: []
    #  - host: ehr.facility.local
    #    port: 443
    #    protocol: rest
    #    enforcement: enforce
    #    rules:
    #      - allow: { method: GET, path: "/api/patients/**" }
    #    binaries:
    #      - { path: /sandbox/app/.venv/bin/python* }
